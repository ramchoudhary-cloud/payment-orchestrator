spring.application.name=payment-orchestrator

server.port=1012
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

spring.datasource.url=jdbc:mysql://localhost:3308/payment-db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9193}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
payment.outbox.topic=${PAYMENT_OUTBOX_TOPIC:payment-terminal-events}
payment.webhook.endpoint-url=${PAYMENT_WEBHOOK_ENDPOINT_URL:http://localhost:8081/webhooks/payments}
payment.webhook.max-attempts=8
payment.webhook.timeout-ms=10000

payment.routing.provider-priority=PROVIDER_A,PROVIDER_B
providers.a.outage-after-charges=${PROVIDER_A_OUTAGE_AFTER_CHARGES:25}
